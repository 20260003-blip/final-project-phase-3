<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbros Baguio | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page page--contact">
  <section class="page-bg" aria-hidden="true">
    <img src="images/misc/canopy.jpg" alt="">
  </section>

  <header class="page__header">
    <section class="header">
      <section class="header__brand">
        <img class="header__logo" src="images/logo.png" alt="Climbros Baguio logo">
        <h1 class="header__title">Climbros</h1>
      </section>

      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="index.html">Home</a></li>
          <li class="nav__item"><a class="nav__link" href="about.html">Climbros Journey</a></li>
          <li class="nav__item"><a class="nav__link" href="services.html">What We Offer</a></li>
          <li class="nav__item"><a class="nav__link nav__link--active" href="contact.html">Get In Touch</a></li>
        </ul>
      </nav>
    </section>
  </header>

  <main class="page__main">
    <section class="content">
      <section class="content__panel" aria-labelledby="contact-title">
        <h2 class="about__title" id="contact-title">Get In Touch</h2>
        <p class="about__text">Send a message to get started on your own adventure.</p>

        <form class="form">
          <section class="form__group">
            <label class="form__label" for="name">Name</label>
            <input class="form__input" id="name" name="name" type="text" placeholder="Your name">
          </section>

          <section class="form__group">
            <label class="form__label" for="email">Email</label>
            <input class="form__input" id="email" name="email" type="email" placeholder="Your email">
          </section>

          <section class="form__group">
            <label class="form__label" for="message">Message</label>
            <textarea class="form__textarea" id="message" name="message" placeholder="Write your message here"></textarea>
          </section>

          <button class="button" type="submit">Send Message</button>
        </form>

        <address class="contact__social">
          <p class="about__text">You can also reach out here:</p>
          <nav class="contact__links" aria-label="Social links">
            <a class="contact__link" href="https://www.facebook.com/anaknigiannis">Facebook</a>
            <a class="contact__link" href="https://www.instagram.com/abttocrygng/">Instagram</a>
          </nav>
        </address>
      </section>
    </section>
  </main>

  <footer class="page__footer">
    <p class="footer__text">©2026 made by Hans Yohannael M. Santos</p>
  </footer>
</body>
</html>
